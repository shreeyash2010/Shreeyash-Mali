<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d3b8"/>
      <stop offset="100%" stop-color="#f5ba90"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2218"/>
      <stop offset="100%" stop-color="#19130d"/>
    </linearGradient>
  </defs>
  
  <!-- Outer warm circle base -->
  <circle cx="100" cy="100" r="96" fill="#fde8d8" stroke="#e8662a" stroke-width="4"/>
  
  <!-- Back hair volume -->
  <circle cx="100" cy="85" r="54" fill="url(#hairGrad)"/>
  
  <!-- Neck -->
  <rect x="88" y="125" width="24" height="28" rx="6" fill="#f0ab7d"/>
  
  <!-- Shoulders / Sweater -->
  <path d="M42 188 C 44 146, 75 142, 100 142 C 125 142, 156 146, 158 188 Z" fill="#e8662a"/>
  <!-- Collar accent -->
  <path d="M84 143 C 94 154, 106 154, 116 143" fill="none" stroke="#fde8d8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Head / Face -->
  <ellipse cx="100" cy="94" rx="40" ry="46" fill="url(#avatarGrad)"/>
  
  <!-- Ears -->
  <ellipse cx="58" cy="95" rx="8" ry="12" fill="#f5ba90"/>
  <ellipse cx="142" cy="95" rx="8" ry="12" fill="#f5ba90"/>
  
  <!-- Modern Hair style -->
  <path d="M58 84 C 58 54, 82 46, 100 46 C 122 46, 142 54, 142 80 C 136 70, 122 66, 112 66 C 96 66, 90 74, 76 74 C 68 74, 62 78, 58 84 Z" fill="url(#hairGrad)"/>
  <!-- Front quiff -->
  <path d="M78 66 C 88 56, 115 54, 128 64 C 114 62, 95 64, 86 70 Z" fill="#3a2e22"/>

  <!-- Eyebrows -->
  <path d="M75 82 Q 86 78 94 82" fill="none" stroke="#2d2218" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 82 Q 114 78 125 82" fill="none" stroke="#2d2218" stroke-width="3" stroke-linecap="round"/>

  <!-- Glasses / Frames (classic developer frames) -->
  <rect x="68" y="86" width="26" height="20" rx="6" fill="none" stroke="#1f1b16" stroke-width="3"/>
  <rect x="106" y="86" width="26" height="20" rx="6" fill="none" stroke="#1f1b16" stroke-width="3"/>
  <path d="M94 94 L 106 94" fill="none" stroke="#1f1b16" stroke-width="3"/>
  <path d="M60 92 L 68 92" fill="none" stroke="#1f1b16" stroke-width="2.5"/>
  <path d="M132 92 L 140 92" fill="none" stroke="#1f1b16" stroke-width="2.5"/>

  <!-- Eyes behind glasses -->
  <circle cx="81" cy="96" r="3.5" fill="#1f1b16"/>
  <circle cx="119" cy="96" r="3.5" fill="#1f1b16"/>
  <!-- Eye sparkles -->
  <circle cx="82" cy="95" r="1.2" fill="#ffffff"/>
  <circle cx="120" cy="95" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M99 99 Q 102 108 97 110" fill="none" stroke="#d5885c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Warm Smile -->
  <path d="M88 119 Q 100 128 112 119" fill="none" stroke="#c9501a" stroke-width="3" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="72" cy="108" rx="6" ry="3.5" fill="#f19478" opacity="0.45"/>
  <ellipse cx="128" cy="108" rx="6" ry="3.5" fill="#f19478" opacity="0.45"/>

  <!-- Monogram badge tag on sweater bottom-right -->
  <circle cx="140" cy="172" r="14" fill="#ffffff" stroke="#1f1b16" stroke-width="2"/>
  <text x="140" y="177" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#e8662a">&lt;/&gt;</text>
</svg>
